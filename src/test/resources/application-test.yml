spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:music_roadmap;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  seed:
    # 테스트는 고정 데이터(28장르)를 쓴다. 실제 데이터가 늘어나도 테스트 기대값이 흔들리지 않게
    location: seed/test-catalog.json
  musicbrainz:
    # 테스트는 실제 MusicBrainz를 부르지 않는다 (MUSICBRAINZ_CONTACT 환경변수 없이도 뜨도록)
    user-agent: MusicRoadmap/0.1 ( test )
  # 테스트는 결과가 매번 같아야 하므로 기본 순서로 고른다 (RANDOM은 씨앗을 고정한 단위 테스트로 따로 검증)
  track-selection:
    default: EXCLUDE_DISLIKED
